name: Build & publish frontend image

# Builds the dashboard container and publishes it to two registries:
#   - GHCR (ghcr.io) — the repo's own package
#   - Google Artifact Registry — the registry the deployment pulls from
#     (GHCR packages can't be made public in this org, so the image is pushed
#     to AR directly rather than proxying GHCR)
# There is NO deploy step here — only image publishing. The image reads its
# config (WEAVIATE_URL / WEAVIATE_API_KEY) from runtime env, so it bakes no
# secrets. Where/how the image is deployed is handled separately, outside
# this repo. The image is built for linux/amd64 — the x86 deployment hosts
# can't run an arm64 image (it fails with "exec format error").
#
# The Artifact Registry push authenticates via Workload Identity Federation:
# the run's GitHub OIDC token is exchanged for a short-lived GCP access token,
# so NO stored credential exists. The impersonated service account holds
# roles/artifactregistry.writer granted ON the target AR repository only —
# not on the project — so even a compromised run can push images to that one
# repository and nothing else.
#
# Required repo config for the Artifact Registry push (all plain variables,
# none of them sensitive — there is no secret):
#   GCP_REGION, GCP_PROJECT_ID, AR_REPOSITORY  — the AR image path
#   GCP_WIF_PROVIDER  — full workload identity provider resource name
#                       (projects/<num>/locations/global/workloadIdentityPools/...)
#   GCP_AR_SA_EMAIL   — the push service account to impersonate
# While GCP_WIF_PROVIDER is unset, the AR steps are skipped and only GHCR is
# published — AR misconfiguration must never block the GHCR image.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR via the built-in GITHUB_TOKEN
  id-token: write # mint the GitHub OIDC token that WIF exchanges for GCP creds

concurrency:
  group: frontend-image
  # Don't cancel in-flight builds: every commit's immutable <sha> image must
  # publish (deploys pin a specific image by <sha>).
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      # ghcr.io/weaviate/weaviate-test-reporter/frontend
      GHCR_IMAGE: ghcr.io/${{ github.repository }}/frontend
      # <region>-docker.pkg.dev/<project>/<repo>/weaviate-test-reporter-frontend
      # (distinct name because AR_REPOSITORY may be a shared repo, e.g. gcr.io)
      AR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/weaviate-test-reporter-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        if: vars.GCP_WIF_PROVIDER != ''
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_AR_SA_EMAIL }}

      - name: Log in to Artifact Registry
        if: vars.GCP_WIF_PROVIDER != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Compute image tags
        id: tags
        env:
          AR_ENABLED: ${{ vars.GCP_WIF_PROVIDER != '' }}
        run: |
          # Publish an immutable <sha> tag (lets a deploy pin an exact
          # commit); AR tags only when WIF is configured. Move :latest (the
          # deploy pointer) ONLY for main, so a workflow_dispatch from a
          # feature branch can't overwrite it with unmerged code.
          tags="${GHCR_IMAGE}:${GITHUB_SHA}"
          if [ "${AR_ENABLED}" = "true" ]; then
            tags="${tags},${AR_IMAGE}:${GITHUB_SHA}"
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${GHCR_IMAGE}:latest"
            if [ "${AR_ENABLED}" = "true" ]; then
              tags="${tags},${AR_IMAGE}:latest"
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: true
          # x86 hosts need amd64. Build a clean single-arch image:
          # provenance/sbom attestations would create a manifest index (with an
          # "unknown/unknown" entry) that some runtimes mis-handle.
          platforms: linux/amd64
          provenance: false
          sbom: false
          # One build, pushed to every tag above (both registries).
          tags: ${{ steps.tags.outputs.tags }}
          # Connects the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
